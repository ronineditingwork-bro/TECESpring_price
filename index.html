<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TECEspring — прайс и расчёт</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>TECEspring сантехника</h1>
  <p id="meta"></p>
</header>

<main>
  <section id="catalog">
    <div class="filters">
      <input id="q" type="search" placeholder="Поиск по названию или артикулу" aria-label="Поиск">
      <select id="section" aria-label="Раздел"><option value="">Все разделы</option></select>
    </div>
    <div id="list"></div>
  </section>

  <aside id="cart">
    <h2>Коммерческое предложение</h2>
    <p class="print-only" id="quote-date"></p>
    <table>
      <thead><tr><th class="sku">Артикул</th><th>Наименование</th><th>Кол-во</th><th>Цена, ₽</th><th>Сумма, ₽</th><th class="no-print"></th></tr></thead>
      <tbody id="cart-rows"></tbody>
      <tfoot><tr><td class="sku"></td><td colspan="3">Итого, с НДС</td><td id="total">0</td><td class="no-print"></td></tr></tfoot>
    </table>
    <p id="empty">Добавьте товары из каталога.</p>
    <div class="actions no-print">
      <button id="print" type="button">Печать / PDF</button>
      <button id="clear" type="button" class="secondary">Очистить</button>
    </div>
  </aside>
</main>

<script src="price.js"></script>
<script src="app.js"></script>
</body>
</html>
