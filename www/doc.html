<!doctype html>
<meta charset="utf-8">
<title>Документ</title>
<!-- iPhone/browser version: shows the invoice the catalog page saved, in the same window -->
<script>
  // a new page can see the saved document a moment late (it may open in another browser process), so wait up to a second
  (function show(tries) {
    var h; try { h = localStorage.getItem('docHtml'); } catch (e) {}
    if (!h && tries) return setTimeout(function () { show(tries - 1); }, 100);
    try { localStorage.removeItem('docHtml'); } catch (e) {} // so the next document can never show this one by mistake
    document.open();
    document.write(h || '<p style="font:18px sans-serif;padding:24px">Документ не найден. Вернитесь в корзину и нажмите «Создать PDF» ещё раз.</p>');
    document.close();
  })(10);
</script>
