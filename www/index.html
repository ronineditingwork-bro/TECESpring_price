<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TECEspring">
<meta name="theme-color" content="#f4f6f8">
<link rel="apple-touch-icon" href="icon-180.png">
<title>TECEspring</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="bar">
  <button type="button" class="backbtn" id="back" aria-label="Назад" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
  </button>
  <a href="#" class="mark" aria-label="TECEspring, каталог"><b>TECE</b>spring</a>
  <label class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
    <input id="q" type="search" enterkeyhint="search" placeholder="Название или артикул" aria-label="Поиск по каталогу">
  </label>
  <a href="#cart" class="cartlink" id="cart-top" aria-label="Корзина">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 4.5h2.2l2.1 10.2h10.4l1.9-7.2H7"/><circle cx="9.5" cy="19" r="1.3"/><circle cx="17" cy="19" r="1.3"/></svg>
    <span class="badge" id="badge-top" hidden></span>
  </a>
</header>

<main>
  <section id="catalog">
    <div class="tabs" id="tabs" role="tablist" aria-label="Разделы"></div>
    <div class="filterline">
      <p class="note" id="meta"></p>
      <label class="toggle"><input type="checkbox" id="in-stock"><span>Только в наличии</span></label>
    </div>
    <div id="list"></div>
  </section>

  <section id="card" class="pane" hidden></section>
  <section id="cart" class="pane" hidden></section>
  <section id="doc" class="pane" hidden></section>
</main>

<nav class="tabbar" aria-label="Разделы приложения">
  <a href="#" id="nav-catalog">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>
    Каталог
  </a>
  <a href="#cart" id="nav-cart">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 4.5h2.2l2.1 10.2h10.4l1.9-7.2H7"/><circle cx="9.5" cy="19" r="1.3"/><circle cx="17" cy="19" r="1.3"/></svg>
    Корзина <span class="badge" id="badge" hidden></span>
  </a>
</nav>
<div id="toast" role="status" aria-live="polite"></div>

<script src="price.js"></script>
<script src="catalog.js"></script>
<script src="stock.js"></script>
<script src="sellers.js"></script>
<script src="docs.js"></script>
<script src="app.js"></script>
</body>
</html>
