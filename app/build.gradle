plugins { id 'com.android.application' }

android {
    namespace 'ru.tece.spring'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.tece.spring'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    // один и тот же интерфейс для APK и для iPhone-сайта на GitHub Pages
    sourceSets { main { assets.srcDirs = ['../www'] } }
    // Fixed debug key in the repo, so each new APK installs over the old one without losing the cart.
    signingConfigs {
        debug { storeFile file('debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
